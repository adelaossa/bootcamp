services:
  db:
    image: postgres:16-alpine
    container_name: bootcamp-db-muro
    environment:
      POSTGRES_USER: estudiante
      POSTGRES_PASSWORD: pass123
      POSTGRES_DB: bootcamp
    ports:
      - "5432:5432"
    volumes:
      - pgdata-muro:/var/lib/postgresql/data

volumes:
  pgdata-muro:
